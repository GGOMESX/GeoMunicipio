name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxe
        run: python -m compileall -q geomunicipio
      - name: Testes
        run: python -m unittest discover -v tests

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir versão da tag com metadata.txt
        run: |
          VERSION=$(grep '^version=' geomunicipio/metadata.txt | cut -d= -f2)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} diferente da versão ${VERSION} do metadata.txt"; exit 1
          fi
      - name: Gerar ZIP
        run: ./package.sh
      - name: Publicar release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" geomunicipio-*.zip --title "GeoMunicípio ${GITHUB_REF_NAME}" --generate-notes
